name: Deploy Ucyenyen Portfolio
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/ucyenyen/portfolio-bryan:latest
  APP_DIR: /var/www/websites/bryan/portfolio-bryanfd

# VPS tidak bisa konek ke ghcr.io / github.com dengan stabil, dan upload image (~100 MB)
# ke VPS terlalu lambat. Jadi yang dikirim hanya source code (~2 MB), lalu image di-build di VPS.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package source
        run: git archive --format=tar.gz -o source.tar.gz HEAD

      - name: Copy source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 15m
          source: source.tar.gz
          target: /tmp/portfolio-deploy

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # Timpa file yang di-track git dengan versi terbaru; .env dan file lokal lain tetap aman.
            tar -xzf /tmp/portfolio-deploy/source.tar.gz -C .
            rm -rf /tmp/portfolio-deploy

            # --network host: container build tidak bisa akses mirror Alpine/npm lewat bridge default.
            docker build --network host -t ${{ env.IMAGE_NAME }} .
            docker compose up -d
            docker image prune -f
