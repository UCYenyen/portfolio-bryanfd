name: Deploy Ucyenyen Portfolio
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/ucyenyen/portfolio-bryan:latest
  APP_DIR: /var/www/websites/bryan/portfolio-bryanfd

# VPS tidak bisa konek ke ghcr.io / github.com dengan stabil, jadi image di-build di sini,
# dikirim ke VPS sebagai file .tar.gz lewat SSH, lalu di-load (bukan di-pull).
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save ${{ env.IMAGE_NAME }} | gzip > portfolio-image.tar.gz

      - name: Copy image and compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "portfolio-image.tar.gz,docker-compose.yml"
          target: ${{ env.APP_DIR }}

      - name: Load image and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # Sinkronkan kode kalau GitHub bisa dijangkau; deploy tidak bergantung pada ini.
            timeout 60 git pull --ff-only origin main || echo "git pull dilewati (GitHub tidak bisa dijangkau)"

            gunzip -c portfolio-image.tar.gz | docker load
            rm -f portfolio-image.tar.gz
            docker compose up -d
            docker image prune -f
