services:
  # Saya ubah nama service-nya juga biar rapi (opsional)
  ucyenyen_portfolio:
    # INI YANG PENTING: Nama container baru
    container_name: ucyenyen_portfolio_app
    image: ghcr.io/ucyenyen/portfolio-bryan:latest
    # Image di-load dari tarball oleh CI (lihat deploy.yml), jangan pull dari GHCR.
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - global_proxy

networks:
  global_proxy:
    external: true